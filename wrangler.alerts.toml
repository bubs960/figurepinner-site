# Cloudflare Worker — FigurePinner Deal Alert Checker
#
# Deploy: npx wrangler deploy --config wrangler.alerts.toml
#
# Required secrets (set via Cloudflare dashboard or wrangler secret put):
#   RESEND_API_KEY       — from resend.com (free tier: 3,000 emails/month)
#   CLERK_SECRET_KEY     — from Clerk dashboard → API Keys
#
# Required env vars (add to [vars] below or set as secrets):
#   FIGUREPINNER_API_URL — your worker URL, e.g. https://figurepinner-site.bubs960.workers.dev
#   FROM_EMAIL           — verified sender in Resend, e.g. alerts@figurepinner.com

name = "figurepinner-alerts"
main = "workers/alert-checker.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Crons (handler branches on event.cron in alert-checker.ts):
#   0 8 * * *    — deal alert check (3am ET / midnight PT)
#   */15 * * * * — site sentinel (S15): revenue-path probes — homepage, figure
#                  page + affiliate campid, search forgiveness sentinels
#                  ("wwe elite 11" / "hulk hogen" must return results), guides.
#                  Emails SENTINEL_EMAIL via Resend on failure, max 1 email/2h.
[triggers]
crons = ["0 8 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "figurepinner-userdata"
database_id = "dd036916-a729-4999-b5ca-8f5287800b23"

[vars]
FIGUREPINNER_API_URL = "https://figurepinner-api.bubs960.workers.dev"
FROM_EMAIL = "alerts@figurepinner.com"
APP_URL = "https://figurepinner.com"
# SENTINEL_EMAIL — where sentinel failure emails go. Moved out of [vars] and
# into a Worker secret 2026-07-27: this repo is PUBLIC, so a plain admin address
# here is a personal email published on the open internet for scraping. It is
# not a credential, but it is PII and it does not belong in tracked config.
#
# ⚠️ ORDER MATTERS, AND IT IS THE OPPOSITE OF WHAT YOU'D EXPECT. The secret
# CANNOT be created while the previous deploy's plain-text var of the same name
# is still live — Cloudflare rejects it with:
#     Binding name 'SENTINEL_EMAIL' already in use  [code: 10053]
# A Worker cannot hold a var and a secret under one name. So:
#   1. npx wrangler deploy --config wrangler.alerts.toml     (drops the var)
#   2. npx wrangler secret put SENTINEL_EMAIL --config wrangler.alerts.toml
#      (run it interactively and paste the address at the prompt — piping via
#       PowerShell appends a newline into the secret value)
#
# Run step 2 IMMEDIATELY after step 1. In between, site-sentinel.ts:112-116
# fails CLOSED: it logs "[sentinel] SENTINEL_EMAIL not set" and sends nothing,
# so the 15-minute revenue-path probes keep running while silently reporting
# no failures. Read identically from env either way, so no code change is
# needed — this is purely a binding-type migration.
# UNSUBSCRIBE_SECRET — set via: npx wrangler secret put UNSUBSCRIBE_SECRET --config wrangler.alerts.toml
# Use the same value in Cloudflare dashboard env vars for the main site (UNSUBSCRIBE_SECRET)
